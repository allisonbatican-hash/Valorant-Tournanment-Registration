<!DOCTYPE html>
<html>
<head>
    <title>Tournament Teams</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="tournament-container">
        <div class="tournament-box">
            <h2>Registered Squads</h2>
            <ul class="squad-list">
                {% for s in squads %}
                <li class="squad-item">
                    <h3>{{ s.team_name }}</h3>
                    <p><strong>Captain:</strong> {{ s.captain }}</p>
                    <p><strong>Contact:</strong> {{ s.contact }}</p>
                    <p><strong>Players:</strong> {{ s.player1 }}, {{ s.player2 }}, {{ s.player3 }}, {{ s.player4 }}, {{ s.player5 }}</p>
                    <form action="/delete/{{ s.id }}" method="POST" style="display: inline;">
                        <button type="submit" onclick="return confirm('Delete this squad?')" class="delete-button">❌ Delete</button>
                    </form>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
