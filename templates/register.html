<!DOCTYPE html>
<html>
<head>
    <title>Register Squad</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Register Your Squad</h2>
            <p class="subtitle">Fill in the details to register your team</p>
            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="team_name">Team Name</label>
                    <input id="team_name" name="team_name" placeholder="Team Name" required>
                </div>
                <div class="form-group">
                    <label for="captain">Team Captain</label>
                    <input id="captain" name="captain" placeholder="Team Captain" required>
                </div>
                <div class="form-group">
                    <label for="contact">Contact</label>
                    <input id="contact" name="contact" placeholder="Email / Discord" required>
                </div>
                <div class="form-group">
                    <label for="player1">Player 1</label>
                    <input id="player1" name="player1" placeholder="Player 1" required>
                </div>
                <div class="form-group">
                    <label for="player2">Player 2</label>
                    <input id="player2" name="player2" placeholder="Player 2" required>
                </div>
                <div class="form-group">
                    <label for="player3">Player 3</label>
                    <input id="player3" name="player3" placeholder="Player 3" required>
                </div>
                <div class="form-group">
                    <label for="player4">Player 4</label>
                    <input id="player4" name="player4" placeholder="Player 4" required>
                </div>
                <div class="form-group">
                    <label for="player5">Player 5</label>
                    <input id="player5" name="player5" placeholder="Player 5" required>
                </div>
                <button type="submit" class="register-button">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
